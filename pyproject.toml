[project]
name = "alphamaker"
version = "0.1.0"
description = "Achtergrond verwijderen met open modellen, op je eigen apparaat (CLI + lokale webpagina)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["onnxruntime>=1.18", "numpy", "pillow", "scipy"]

[project.optional-dependencies]
# BiRefNet (haar, --voorkeur precies); InSPyReNet draait als ONNX en heeft dit niet nodig.
# Installeer torch eerst vanaf https://download.pytorch.org/whl/cpu
beste = ["torch", "torchvision", "timm", "kornia", "einops", "transformers<5", "safetensors"]

[project.scripts]
alphamaker = "alphamaker.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["alphamaker"]

[tool.setuptools.package-data]
alphamaker = ["static/*.html"]
