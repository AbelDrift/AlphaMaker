name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy pillow scipy
      - name: syntax webversie
        run: for f in docs/*.js tests/web/*.mjs; do node --check "$f"; done
      - name: pariteit webversie ↔ Python (zonder modellen)
        run: node --test tests/web/refine.test.mjs
      - name: Python-tests (zonder modellen)
        run: python tests/test_core.py && python alphamaker/refine.py
