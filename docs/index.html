<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlphaMaker</title>
<meta name="description" content="Achtergrond verwijderen in je browser. Je foto verlaat je apparaat niet.">
<style>
  :root { --bg:#f6f6f4; --fg:#1d1d1b; --muted:#6b6b66; --accent:#2f6fde; --card:#fff; --line:#ddd; --warn:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151514; --fg:#ececea; --muted:#9a9a94; --card:#20201e; --line:#3a3a37; --warn:#ff8a80; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:960px; margin:0 auto; padding:24px 16px; }
  h1 { margin:0 0 4px; font-size:1.6rem; }
  p { margin:0 0 16px; color:var(--muted); }
  #drop { display:block; border:2px dashed var(--line); border-radius:12px; padding:40px 16px; text-align:center; cursor:pointer; background:var(--card); }
  #drop.over, #drop:focus-within { border-color:var(--accent); }
  #drop input { position:absolute; opacity:0; width:1px; height:1px; }
  #status { min-height:1.5em; margin:12px 0 4px; }
  #bar { display:block; width:100%; height:8px; margin-bottom:12px; accent-color:var(--accent); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:16px; }
  figure { margin:0; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px; }
  figcaption { font-size:.9rem; color:var(--muted); padding:4px; }
  img, canvas { display:block; width:100%; height:auto; border-radius:8px; }
  .checker { background:repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0/20px 20px; }
  .tools { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-top:16px; }
  .settings { display:flex; flex-direction:column; gap:4px; margin-bottom:16px; }
  .settings p { margin:0; font-size:.9rem; }
  .settings p.warn { color:var(--warn); font-weight:600; }
  button, label.btn, select { font:inherit; padding:8px 16px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  select { padding:6px 8px; max-width:100%; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled, select:disabled { opacity:.5; cursor:default; }
  .opt { display:inline-flex; gap:8px; margin-top:8px; color:var(--muted); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>AlphaMaker</h1>
  <p>Achtergrond verwijderen in je browser. Je foto verlaat je apparaat niet: alleen de rekenmodellen worden eenmalig van Hugging Face gedownload en daarna bewaard.</p>
  <noscript><p>AlphaMaker heeft JavaScript nodig.</p></noscript>

  <div class="settings">
    <label>Model <select id="model"></select></label>
    <p id="license"></p>
    <p id="engine"></p>
    <label class="opt"><input id="fijn" type="checkbox"> Fijne randen (experimenteel; extra model van 26 MB, was in onze tests niet beter)</label>
    <label class="opt"><input id="groot" type="checkbox"> Groot verfijningsmodel (99 MB, iets nauwkeuriger)</label>
  </div>

  <label id="drop">
    <input id="file" type="file" accept="image/*">
    <strong>Kies een foto</strong>, sleep hem hierheen of plak met Ctrl+V
  </label>
  <div id="status" role="status" aria-live="polite"></div>
  <progress id="bar" max="1" aria-label="Voortgang" hidden></progress>

  <section id="result" hidden>
    <div class="grid">
      <figure><img id="orig" alt="Origineel"><figcaption>Origineel</figcaption></figure>
      <figure><canvas id="out" class="checker" aria-label="Resultaat zonder achtergrond"></canvas><figcaption>Resultaat</figcaption></figure>
    </div>
    <div class="tools">
      <label>Achtergrond
        <select id="bgmode"><option value="none">Transparant</option><option value="color">Kleur</option></select>
      </label>
      <input id="bgcolor" type="color" value="#ffffff" aria-label="Achtergrondkleur" hidden>
      <button id="download" class="primary">Download PNG</button>
    </div>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
