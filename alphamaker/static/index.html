<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlphaMaker</title>
<style>
  :root { --bg:#f6f6f4; --fg:#1d1d1b; --muted:#6b6b66; --accent:#2f6fde; --card:#fff; --line:#ddd; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151514; --fg:#ececea; --muted:#9a9a94; --card:#20201e; --line:#3a3a37; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:960px; margin:0 auto; padding:24px 16px; }
  h1 { margin:0 0 4px; font-size:1.6rem; }
  p { margin:0 0 16px; color:var(--muted); }
  #drop { display:block; border:2px dashed var(--line); border-radius:12px; padding:40px 16px; text-align:center; cursor:pointer; background:var(--card); }
  #drop.over, #drop:focus-within { border-color:var(--accent); }
  #drop input { position:absolute; opacity:0; width:1px; height:1px; }
  #status { min-height:1.5em; margin:12px 0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:16px; }
  figure { margin:0; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px; }
  figcaption { font-size:.9rem; color:var(--muted); padding:4px; }
  img, canvas { display:block; width:100%; height:auto; border-radius:8px; }
  .checker { background:repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0/20px 20px; }
  .tools { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-top:16px; }
  button, label.btn { font:inherit; padding:8px 16px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  .opt { display:inline-flex; gap:8px; margin-top:12px; color:var(--muted); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>AlphaMaker</h1>
  <p>Achtergrond verwijderen op je eigen pc. Je foto gaat nergens anders heen.</p>

  <label id="drop">
    <input id="file" type="file" accept="image/*">
    <strong>Kies een foto</strong>, sleep hem hierheen of plak met Ctrl+V
  </label>
  <label class="opt">Model <select id="model" aria-label="Model"></select></label>
  <label class="opt"><input id="fijn" type="checkbox"> Fijne randen (experimenteel, was in tests niet beter)</label>
  <div id="status" role="status" aria-live="polite"></div>

  <section id="result" hidden>
    <div class="grid">
      <figure><img id="orig" alt="Origineel"><figcaption>Origineel</figcaption></figure>
      <figure><canvas id="out" class="checker" aria-label="Resultaat zonder achtergrond"></canvas><figcaption>Resultaat</figcaption></figure>
    </div>
    <div class="tools">
      <label>Achtergrond
        <select id="bgmode"><option value="none">Transparant</option><option value="color">Kleur</option><option value="image">Foto</option></select>
      </label>
      <input id="bgcolor" type="color" value="#ffffff" aria-label="Achtergrondkleur" hidden>
      <input id="bgimage" type="file" accept="image/*" aria-label="Achtergrondfoto kiezen" hidden>
      <label class="opt"><input id="crop" type="checkbox"> Bijsnijden tot onderwerp</label>
      <label class="opt">Marge <input id="margin" type="number" min="0" max="50" step="1" value="5" style="width:4em"> %</label>
      <label class="opt"><input id="shadow" type="checkbox"> Schaduw</label>
      <label>Penseel <select id="brush"><option value="">Uit</option><option value="erase">Gum (wissen)</option><option value="restore">Herstellen</option></select></label>
      <label class="opt">Grootte <input id="brushsize" type="range" min="4" max="200" value="40" aria-label="Penseelgrootte"></label>
      <label>Bestand <select id="format"><option value="png">PNG (transparant)</option><option value="jpg">JPG</option><option value="mask">Alleen masker (PNG)</option></select></label>
      <button id="download" class="primary">Download</button>
    </div>
  </section>
</main>

<script type="module">
const $ = id => document.getElementById(id);
const status = t => $('status').textContent = t;
let cutout, name = 'alphamaker', busy = false;

async function handle(file) {
  if (!file?.type.startsWith('image/')) return status('Dat is geen afbeelding.');
  if (busy) return status('Even geduld, de vorige foto is nog bezig.');
  busy = true;
  name = file.name.replace(/\.[^.]+$/, '') || 'alphamaker';
  if ($('orig').src) URL.revokeObjectURL($('orig').src);
  $('orig').src = URL.createObjectURL(file);
  $('download').disabled = true;
  const t0 = performance.now();
  try {
    status('Achtergrond verwijderen… (op een gewone pc kan dat tot een minuut duren)');
    const r = await fetch('/api/cutout?model=' + encodeURIComponent($('model').value) + ($('fijn').checked ? '&fijn=1' : ''), { method: 'POST', body: file });
    if (!r.ok) throw new Error(await r.text());
    const bmp = await createImageBitmap(await r.blob());
    const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
    const ctx = c.getContext('2d'); ctx.drawImage(bmp, 0, 0);
    cutout = ctx.getImageData(0, 0, c.width, c.height);
    box = subjectBox(cutout);
    source = file; origP = null;  // originele foto voor 'Herstellen'
    render();
    $('result').hidden = false;
    $('download').disabled = false;
    status(`Klaar in ${((performance.now() - t0) / 1000).toFixed(1)} s.`);
  } catch (e) {
    status('Mislukt: ' + e.message);
  } finally { busy = false; }
}

// overgenomen uit docs/app.js: houd beide gelijk
let source = null, origP = null;
let bgImg = null, box = null, rect = null;  // achtergrondfoto, onderwerp-kader en getoonde uitsnede

function subjectBox({ width: w, height: h, data }) {  // kleinste rechthoek met alpha > 8, zoals core.finish
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++)
    if (data[4 * (y * w + x) + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  return x1 < 0 ? null : { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
}

// afwerking zoals core.finish (bijsnijden + marge, achtergrondkleur/-foto, schaduw), alles lokaal op canvas
function render() {
  const src = Object.assign(document.createElement('canvas'), { width: cutout.width, height: cutout.height });
  src.getContext('2d').putImageData(cutout, 0, 0);
  let r = { x: 0, y: 0, w: cutout.width, h: cutout.height };
  if ($('crop').checked && box) {
    const m = Math.min(50, Math.max(0, Number($('margin').value) || 0)) / 100, mx = Math.round(box.w * m), my = Math.round(box.h * m);
    const x = Math.max(0, box.x - mx), y = Math.max(0, box.y - my);
    r = { x, y, w: Math.min(cutout.width, box.x + box.w + mx) - x, h: Math.min(cutout.height, box.y + box.h + my) - y };
  }
  const c = $('out'), ctx = c.getContext('2d');
  c.width = r.w; c.height = r.h;
  rect = r;
  const mode = $('bgmode').value;
  if (mode === 'color') { ctx.fillStyle = $('bgcolor').value; ctx.fillRect(0, 0, r.w, r.h); }
  if (mode === 'image' && bgImg) {  // 'cover': vullen en bijsnijden, zoals ImageOps.fit
    const s = Math.max(r.w / bgImg.width, r.h / bgImg.height), bw = bgImg.width * s, bh = bgImg.height * s;
    ctx.drawImage(bgImg, (r.w - bw) / 2, (r.h - bh) / 2, bw, bh);
  }
  if ($('shadow').checked) {  // zachte slagschaduw: ~1% van de lange zijde, 50% dekking
    const d = Math.max(2, Math.round(Math.max(r.w, r.h) * 0.01));
    Object.assign(ctx, { shadowColor: 'rgba(0,0,0,0.5)', shadowBlur: 2 * d, shadowOffsetX: d, shadowOffsetY: d });
  }
  ctx.drawImage(src, r.x, r.y, r.w, r.h, 0, 0, r.w, r.h);
  src.width = src.height = 0;
}

$('file').onchange = e => handle(e.target.files[0]);
$('bgmode').onchange = () => {
  $('bgcolor').hidden = $('bgmode').value !== 'color';
  $('bgimage').hidden = $('bgmode').value !== 'image';
  if (cutout) render();
};
$('bgcolor').oninput = () => cutout && render();
$('bgimage').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  bgImg?.close();
  bgImg = await createImageBitmap(f).catch(() => null);
  if (!bgImg) status('Kon de achtergrondfoto niet openen.');
  if (cutout) render();
};
for (const id of ['crop', 'margin', 'shadow']) $(id).oninput = () => cutout && render();
// PNG (transparant), JPG (witte ondergrond) of alleen het masker (alfa als grijswaarden, zoals remove.bg channels=alpha)
$('download').onclick = () => {
  const fmt = $('format').value, c = $('out');
  let src = c, type = 'image/png', suffix = '-alpha.png';
  if (fmt !== 'png') {
    src = Object.assign(document.createElement('canvas'), { width: c.width, height: c.height });
    const x = src.getContext('2d');
    if (fmt === 'jpg') {
      x.fillStyle = '#ffffff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(c, 0, 0);
      type = 'image/jpeg'; suffix = '-alpha.jpg';
    } else {
      const d = x.createImageData(rect.w, rect.h);
      for (let y = 0; y < rect.h; y++) for (let i = 0; i < rect.w; i++) {
        const a = cutout.data[4 * ((y + rect.y) * cutout.width + i + rect.x) + 3], j = 4 * (y * rect.w + i);
        d.data[j] = d.data[j + 1] = d.data[j + 2] = a; d.data[j + 3] = 255;
      }
      x.putImageData(d, 0, 0); suffix = '-masker.png';
    }
  }
  src.toBlob(b => {
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(b), download: name + suffix });
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  }, type, 0.92);
};
const drop = $('drop');
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); handle(e.dataTransfer.files[0]); };
addEventListener('paste', e => { const f = e.clipboardData.files[0]; if (f) handle(f); });
fetch('/api/models').then(r => r.json()).then(({ models, default: d, noncommercial = [] }) => {
  const label = m => noncommercial.includes(m) ? m + ' (NIET voor commercieel gebruik)'
    : m === 'inspyrenet' ? m + ' (standaard, MIT)' : m === 'birefnet-general' ? m + ' (beste voor haar, MIT)' : m;
  $('model').replaceChildren(...models.map(m => new Option(label(m), m)));
  $('model').value = d;
}).catch(() => {});
// overgenomen uit docs/app.js: houd gelijk
// penseel zoals de editor van remove.bg: gum (alpha 0) of herstellen (originele pixels terug)
let painting = false, queued = false;
const redraw = () => { if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; render(); }); } };
async function originalPixels() {  // originele foto op de maat van het resultaat (ook als die verkleind was)
  const bmp = await createImageBitmap(source);
  const c = Object.assign(document.createElement('canvas'), { width: cutout.width, height: cutout.height });
  const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(bmp, 0, 0, c.width, c.height); bmp.close();
  const px = x.getImageData(0, 0, c.width, c.height).data;
  c.width = c.height = 0;
  return px;
}
async function paint(e) {
  const mode = $('brush').value;
  if (!mode || !cutout || !rect) return;
  const c = $('out'), b = c.getBoundingClientRect(), k = c.width / b.width;
  const cx = rect.x + (e.clientX - b.left) * k, cy = rect.y + (e.clientY - b.top) * k;
  const rad = Number($('brushsize').value) * k / 2;  // grootte in schermpixels
  const o = mode === 'restore' && source ? await (origP ??= originalPixels()) : null;
  const d = cutout.data, W = cutout.width;
  for (let y = Math.max(0, Math.floor(cy - rad)); y <= Math.min(cutout.height - 1, cy + rad); y++)
    for (let x = Math.max(0, Math.floor(cx - rad)); x <= Math.min(W - 1, cx + rad); x++) {
      if ((x - cx) ** 2 + (y - cy) ** 2 > rad * rad) continue;
      const i = 4 * (y * W + x);
      if (o) { d[i] = o[i]; d[i + 1] = o[i + 1]; d[i + 2] = o[i + 2]; d[i + 3] = 255; } else d[i + 3] = 0;
    }
  redraw();
}
const out = $('out');
out.onpointerdown = e => {
  if (!$('brush').value) return;
  painting = true;
  try { out.setPointerCapture(e.pointerId); } catch {}
  paint(e);
};
out.onpointermove = e => { if (painting) paint(e); };
out.onpointerup = out.onpointercancel = () => { if (painting) { painting = false; box = subjectBox(cutout); } };
$('brush').onchange = () => { out.style.touchAction = $('brush').value ? 'none' : ''; out.style.cursor = $('brush').value ? 'crosshair' : ''; };
</script>
</body>
</html>
